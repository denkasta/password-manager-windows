[package]
name = "password-manager"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "PasswordManager"
path = "main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
aes-gcm = "0.10.3"
arboard = { version = "3.7.0", default-features = false }
argon2 = "0.5.3"
base64 = "0.23.1"
getrandom = "0.3.4"
rfd = "0.18.0"
serde_json = "1.0.154"
tao = "0.37.2"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
wry = "0.57.2"
zip = { version = "9.5.1", default-features = false, features = ["aes-crypto", "deflate"] }

[build-dependencies]
winres = "0.1.12"

[profile.dev.package."*"]
opt-level = 3
